name: SentinelAI Comprehensive Security & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-security-quality:
    name: Backend SAST, Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black formatting check
        run: |
          black --check backend/

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r backend/ -ll

      - name: Run Semgrep SAST Audit
        run: |
          semgrep --config=p/security-audit backend/ --error

      - name: Run mypy Strict Type Checking
        run: |
          mypy backend/ --strict --show-error-codes

      - name: Run Pylint Code Quality
        run: |
          pylint backend/app/ --fail-under=8.5

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit

      - name: Run Pytest Suite with Coverage
        run: |
          pytest backend/tests/ -v

  frontend-security:
    name: Frontend Lint & Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install

      - name: Run NPM Audit
        run: |
          cd dashboard
          npm audit --audit-level=moderate

  trufflehog-secrets:
    name: TruffleHog Secrets Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
